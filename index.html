<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Jelly Scene</title>
    <link rel="stylesheet" href="style.css">

    <!-- Карточка импортов для разрешения модулей -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <div id="webgl-container">
        <button id="launch-btn" class="jelly-btn">Подбросить желе</button>

<style>
.jelly-btn {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    padding: 12px 24px;
    background: rgba(74, 74, 226, 0.8);
    color: #ffffff;
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 30px;
    font-family: inherit;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    backdrop-filter: blur(10px);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    transition: all 0.2s ease;
    z-index: 100;
}
.jelly-btn:hover {
    background: rgba(90, 90, 255, 1);
    transform: translateX(-50%) scale(1.05);
}
.jelly-btn:active {
    transform: translateX(-50%) scale(0.95);
}
</style>
    </div>

    <script type="module" src="js/main.js"></script>

    <!-- Добавь этот блок перед закрывающим </body> -->
<div id="controls-panel">
    <h3>Физика желе</h3>
    
    <div class="control-group">
        <label for="stiffness">Упругость: <span id="stiffness-val">0.0006</span></label>
        <input type="range" id="stiffness" min="0.0001" max="0.005" step="0.0001" value="0.0006">
    </div>
    
    <div class="control-group">
        <label for="damping">Вязкость: <span id="damping-val">0.90</span></label>
        <input type="range" id="damping" min="0.5" max="0.99" step="0.01" value="0.9">
    </div>
    
    <div class="control-group">
        <label for="gravity">Гравитация: <span id="gravity-val">0.001</span></label>
        <input type="range" id="gravity" min="0.0001" max="0.01" step="0.0001" value="0.001">
    </div>
    
    <div class="control-group">
        <label for="bounce">Отскок: <span id="bounce-val">0.10</span></label>
        <input type="range" id="bounce" min="0" max="0.8" step="0.01" value="0.1">
    </div>
</div>
</body>
</html>
